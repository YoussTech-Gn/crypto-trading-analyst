version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: crypto-analyst-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analyst_dev_password}  # local development only; set your own in .env
      POSTGRES_DB: crypto_trading_analyst
    ports:
      - "127.0.0.1:5432:5432"  # bound to this computer only, never to the network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/0001_initial_foundation.sql:/docker-entrypoint-initdb.d/0001_initial_foundation.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d crypto_trading_analyst"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
